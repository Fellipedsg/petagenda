name = "petagenda"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Lembretes: roda de hora em hora.
[triggers]
crons = ["0 * * * *"]

# Sem id: o wrangler cria o namespace sozinho no primeiro deploy.
[[kv_namespaces]]
binding = "BOOKINGS"

[vars]
ALLOWED_ORIGIN = "https://fellipedsg.github.io"

# Segredos (não ficam aqui): TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_WHATSAPP_FROM, PETSHOP_WHATSAPP
